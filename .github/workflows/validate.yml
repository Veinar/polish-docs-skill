name: Validate skills

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate SKILL.md files
        run: python scripts/validate_skills.py skills
      - name: Lint Polish templates
        run: python skills/writing-docs-in-polish/scripts/lint_pl.py --strict skills/writing-docs-in-polish/assets/templates
      - name: Validate JSON manifests
        run: |
          python -m json.tool .claude-plugin/plugin.json > /dev/null
          python -m json.tool .claude-plugin/marketplace.json > /dev/null
          python -m json.tool evals/evals.json > /dev/null
          python -m json.tool evals/regression-dev-docs.json > /dev/null
